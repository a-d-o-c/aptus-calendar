<svg width="1150" height="1150" viewBox="0 0 1150 1150" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Aptus Calendar Wheel</title>
<desc>A 13-month radial calendar wheel. Inner ring: 13 named months colored by season (spring green, summer gold, autumn rust, winter purple). Middle ring: 52 week ticks. Outer ring: 364 day ticks. Markers for Otium, equinoxes and solstices sit outside the day ring.</desc>
<defs>
