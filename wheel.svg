  .month-name { font-family: 'Crimson Pro', Georgia, serif; font-size: 21px; font-weight: 600; fill: #faf9f7; text-anchor: middle; }
  .month-dates { font-family: 'DM Mono', 'Courier New', monospace; font-size: 11px; fill: #faf9f7; fill-opacity: 0.82; text-anchor: middle; letter-spacing: 0.02em; }
  .marker-label { font-family: 'DM Mono', 'Courier New', monospace; font-size: 12.5px; fill: #1a1816; text-anchor: middle; letter-spacing: 0.04em; }
  .hub-title { font-family: 'Crimson Pro', Georgia, serif; font-size: 40px; font-weight: 600; fill: #1a1816; text-anchor: middle; }
  .hub-sub { font-family: 'DM Mono', 'Courier New', monospace; font-size: 12px; fill: #6b6560; text-anchor: middle; letter-spacing: 0.12em; }
  .hub-year { font-family: 'DM Mono', 'Courier New', monospace; font-size: 13px; fill: #5fb045; text-anchor: middle; letter-spacing: 0.08em; }
</style>
</defs>

