<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aptus Calendar</title>

  <!-- This page is the original static site, kept only as a redirect. The live
       product is the Next.js app in aptus-next/, served at aptuscalendar.com.
       GitHub Pages still serves this path, so anyone holding an old link lands
       on the real thing instead of a half-working copy. -->
  <link rel="canonical" href="https://aptuscalendar.com/">
  <meta http-equiv="refresh" content="0; url=https://aptuscalendar.com/">
  <meta name="robots" content="noindex, follow">

  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121110;
      color: #ede8de;
      font-family: 'Libre Baskerville', Georgia, serif;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .mark {
      font-family: Georgia, serif;
      font-size: 1.5rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    p { color: #9a8870; line-height: 1.8; margin: 0 0 1.5rem; }
    a { color: #c0a880; }
  </style>
</head>
<body>
  <main>
    <div class="mark">Aptus</div>
    <p>Aptus has moved to aptuscalendar.com.</p>
    <p><a href="https://aptuscalendar.com/">Continue &rarr;</a></p>
  </main>
  <script>location.replace('https://aptuscalendar.com/');</script>
</body>
</html>
